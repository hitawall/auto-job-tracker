name: Dispatch Job Alerts

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Call dispatch-alerts endpoint
        run: |
          curl -sf -X GET "$APP_URL/api/cron/dispatch-alerts" \
            -H "Authorization: Bearer $CRON_SECRET" | cat
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
